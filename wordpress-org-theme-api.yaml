openapi: 3.1.0
info:
  title: WordPress.org Theme Directory API
  description: Query the official WordPress theme repository for metadata, search, and compatibility info.
  version: 1.2.0
servers:
  - url: https://api.wordpress.org/themes/info/1.2/
paths:
  /:
    get:
      summary: Query theme information
      operationId: queryTheme
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [query_themes, theme_information, hot_tags, feature_list]
        - name: request[search]
          in: query
          schema: { type: string }
        - name: request[slug]
          in: query
          schema: { type: string }
        - name: request[author]
          in: query
          schema: { type: string }
        - name: request[browse]
          in: query
          schema:
            type: string
            enum: [popular, new, updated, featured]
        - name: request[page]
          in: query
          schema: { type: integer, default: 1 }
        - name: request[per_page]
          in: query
          schema: { type: integer, default: 24, maximum: 100 }
        - name: request[fields][screenshot_url]
          in: query
          schema: { type: boolean, default: true }
        - name: request[fields][active_installs]
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: object
                    properties:
                      page: { type: integer }
                      pages: { type: integer }
                      results: { type: integer }
                  themes:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        version: { type: string }
                        preview_url: { type: string, format: uri }
                        screenshot_url: { type: string, format: uri }
                        rating: { type: number }
                        requires: { type: string }
                        requires_php: { type: string }
        '400':
          description: Invalid parameters

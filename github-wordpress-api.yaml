openapi: 3.1.0
info:
  title: GitHub API - WordPress Repositories
  description: Access WordPress core, Gutenberg, and handbook source files via GitHub API.
  version: 2022-11-28
servers:
  - url: https://api.github.com
paths:
  /repos/WordPress/WordPress/contents/{path}:
    get:
      summary: Get file/folder contents from WordPress core repo
      operationId: getWordPressFile
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: Path within repo (e.g., "wp-includes/rest-api")
        - name: ref
          in: query
          schema: { type: string, default: "master" }
          description: Git reference (branch, tag, or SHA)
      responses:
        '200':
          description: File or directory content
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      name: { type: string }
                      path: { type: string }
                      sha: { type: string }
                      size: { type: integer }
                      content: { type: string, description: "Base64-encoded file content" }
                      encoding: { type: string, enum: [base64] }
                  - type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
                        type: { type: string, enum: [file, dir] }
                        download_url: { type: string, format: uri }
        '404':
          description: Path not found
  /repos/WordPress/gutenberg/contents/docs:
    get:
      summary: List Gutenberg handbook docs
      operationId: listGutenbergDocs
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    path: { type: string }
                    type: { type: string, enum: [file, dir] }
                    download_url: { type: string, format: uri }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: GitHub Personal Access Token (optional for higher rate limits)